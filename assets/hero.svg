<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vedant Gawde — Building Software. Exploring Intelligence.</title>
  <desc id="desc">A dark cyberpunk-inspired terminal banner with neon accents and animated elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.5" stop-color="#091428"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a3a5c" stroke-width="0.6" opacity=".4"/>
    </pattern>
    <linearGradient id="glow-line" x1="0" x2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#7b2fff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-line2" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7b2fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7b2fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Orbs -->
  <ellipse cx="1050" cy="80" rx="220" ry="200" fill="url(#orb1)"/>
  <ellipse cx="150" cy="300" rx="180" ry="160" fill="url(#orb2)"/>

  <!-- Decorative circles -->
  <circle cx="1060" cy="80" r="140" fill="none" stroke="#7b2fff" stroke-width="1" opacity=".25"/>
  <circle cx="1060" cy="80" r="100" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity=".2"/>
  <circle cx="1060" cy="80" r="60"  fill="none" stroke="#7b2fff" stroke-width="0.5" opacity=".3"/>

  <!-- Scan lines (subtle) -->
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.15"/>

  <!-- Terminal window -->
  <rect x="60" y="44" width="1080" height="272" rx="16" fill="#060d1a" fill-opacity=".88" stroke="#1e3d60" stroke-width="1.5"/>

  <!-- Terminal title bar -->
  <rect x="60" y="44" width="1080" height="36" rx="16" fill="#0a1628" stroke="#1e3d60" stroke-width="1.5"/>
  <rect x="60" y="62" width="1080" height="18" fill="#0a1628"/>

  <!-- Window buttons -->
  <circle cx="92"  cy="62" r="6" fill="#ff5f57"/>
  <circle cx="114" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="136" cy="62" r="6" fill="#28c840"/>

  <!-- Terminal path -->
  <text x="162" y="67" fill="#4a7fa5" font-family="'Courier New', monospace" font-size="12">~/dev/vedant</text>
  <text x="264" y="67" fill="#7b2fff" font-family="'Courier New', monospace" font-size="12"> git:(main)</text>
  <text x="348" y="67" fill="#28c840" font-family="'Courier New', monospace" font-size="12"> ✓</text>

  <!-- Accent lines -->
  <path d="M60 290H1140" stroke="url(#glow-line)" stroke-width="2"/>
  <path d="M60 294H1140" stroke="url(#glow-line2)" stroke-width="1" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="92" y="102" width="4" height="88" rx="2" fill="#7b2fff" opacity="0.9"/>

  <!-- Main name -->
  <text x="112" y="148" fill="#e8f4ff" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="3" filter="url(#text-glow)">VEDANT GAWDE</text>

  <!-- Subtitle with gradient simulation -->
  <text x="114" y="186" fill="#00d4ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="1">Full-Stack Developer</text>
  <text x="318" y="186" fill="#6b7f99" font-family="Arial, Helvetica, sans-serif" font-size="20">  ⟡  </text>
  <text x="380" y="186" fill="#7b2fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="1">Applied AI / ML</text>

  <!-- Terminal prompt line -->
  <text x="114" y="234" fill="#4a7fa5" font-family="'Courier New', monospace" font-size="16">❯ </text>
  <text x="142" y="234" fill="#c8d8ea" font-family="'Courier New', monospace" font-size="16">Building Software. Exploring Intelligence.</text>
  <text x="596" y="234" fill="#00d4ff" font-family="'Courier New', monospace" font-size="16" opacity="0.9">▋</text>

  <!-- Bottom right badge -->
  <rect x="980" y="268" width="140" height="26" rx="6" fill="#0d1f3c" stroke="#1e3d60" stroke-width="1"/>
  <text x="1050" y="285" text-anchor="middle" fill="#4a7fa5" font-family="'Courier New', monospace" font-size="11">B.TECH IT · 2028</text>
</svg>
